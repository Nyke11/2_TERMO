<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <title>CatConnect</title>
</head>
<body>
    <section class="container-fluid bg-info text-dark p-4 rounded">

        <h4 class="fw-bold text-white">
            FactoryConnect - Portal de Gestão Industrial
        </h4>

        <p class="text-white mt-3">
            Uma indústria está digitalizando seus processos e contratou a DevSolutions para criar uma interface
            Web responsiva que centralize informções das principais áreas.
        </p>

        <section class="row text-center g-2">

            <article class="col-12 col-md-4">
                <aside class="bg-warning p-2 rounded">
                    <button class="btn btn-light">Produção</button>
                </aside>
            </article>

            <article class="col-12 col-md-4">
                <aside class="bg-success p-2 rounded">
                    <button class="btn btn-light">Manutenção</button>
                </aside>
            </article>

            <article class="col-12 col-md-4">
                <aside class="bg-danger p-2 rounded">
                    <button class="btn btn-light">Qualidade</button>
                </aside>
            </article>

            <article class="col-12 col-md-4">
                <aside class="bg-primary p-2 rounded">
                    <button class="btn btn-light">Logística</button>
                </aside>
            </article>

            <article class="col-12 col-md-4">
                <aside class="bg-secondary p-2 rounded">
                    <button class="btn btn-light">Segurança</button>
                </aside>
            </article>

            <article class="col-12 col-md-4">
                <aside class="bg-warning p-2 rounded">
                    <button class="btn btn-light">Tecnologia</button>
                </aside>
            </article>

        </section>
</body>
</html>
