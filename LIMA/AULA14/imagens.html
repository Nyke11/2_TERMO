<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="imagens.css">
    <title>Revisão Imagens e Vídeos</title>
</head>
<body>
    <h1>Trabalhando com Imagens</h1>
    <h2>Imagem responsiva básica</h2>
    <figure class="resp-bas">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkys_yIGfRLhcCnvY6J15YwTl98uNS8mbo_z_4iXYjdA&s=10" alt="Imagem 1">
    </figure>

    <h2>Imagem com Recorte</h2>
    <figure class="img-rec">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRiDjSr-wwMksH07pqWMpyXxznhzHkIw7MTAMz1O3WD3w&s=10" alt="Imagem 2">
    </figure>

    <h2>Imagem em formato de cards</h2>
    <figure class="img-card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRL_zABnCt73wpYlDHHTbp5iPiiz3iDEr_9TeDsRHGDCg&s=10" alt="Imagem 3">
    </figure>

    <h2>Personalização</h2>
    <figure class="pers-img">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTUJ-Ix6k_tZL-SdoMEbCKf_Ma7_vaQVAHJL7_4lninic-pQysbKJ8YjiU&s=10" alt="Imagem 4">
    </figure>

    <h2>Imagens em Grid</h2>
    <section class="sec-grid">
        <article class="img-grid">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQkbCglEgNuEy9nZNVfM-9AjgBGDuGcJfGH40nqNsAewQ&s=10" alt="Imagem 5">
        </article>

        <article class="img-grid">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfKrMJCNelAnLxtbB-06yElU3mFAgjOoAIA1nTyfzvVQ&s=10" alt="Imagem 6">
        </article>

        <article class="img-grid">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrNUSShyI2-BqsAWSJNIDIuAHoWJFMgG2uqx16lAErdA&s=10" alt="Imagem 7">
        </article>
    </section>

    <section class="video">

        <iframe class="video-bd" height="315" src="https://www.youtube.com/embed/8q_UMULWmrc?si=0LNScvrAak7AtmMW" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</html>
